<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF0F3">
  <title>个人中心 - 鞠婧祎应援站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#FF6B8B',light:'#FFF0F3',dark:'#4A4A4A'}}}};</script>
  <style>body{background:#FFF0F3;color:#4A4A4A;font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen px-4 py-10">
  <main class="mx-auto max-w-2xl">
    <header class="flex items-center justify-between gap-4 mb-7">
      <a href="./index.html" class="text-primary hover:underline"><i class="fa fa-arrow-left mr-1"></i>返回首页</a>
      <button id="logout-button" type="button" class="rounded-lg border border-gray-300 bg-white px-4 py-2 hover:bg-gray-50">退出登录</button>
    </header>
    <section class="bg-white rounded-2xl shadow-lg p-6 sm:p-9">
      <h1 class="text-2xl font-bold">个人中心</h1>
      <p class="mt-2 text-sm text-gray-500">维护你的昵称和头像。邮箱仅用于账户验证，不会在公开留言中展示。</p>
      <form id="profile-form" class="mt-8 space-y-6">
        <div class="flex flex-col sm:flex-row items-center gap-5">
          <img id="avatar-preview" src="./assets/default-avatar.svg" alt="头像预览" class="w-24 h-24 rounded-full object-cover border border-gray-200 bg-light">
          <div class="flex-1 w-full">
            <label for="avatar-file" class="block text-sm font-medium mb-2">头像</label>
            <input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp" class="block w-full text-sm file:mr-4 file:rounded-lg file:border-0 file:bg-light file:px-4 file:py-2 file:text-primary">
            <p class="mt-2 text-xs text-gray-500">支持 PNG、JPG、WebP，最大 2 MB。</p>
          </div>
        </div>
        <div>
          <label for="display-name" class="block text-sm font-medium mb-2">昵称</label>
          <input id="display-name" type="text" maxlength="40" required class="w-full rounded-lg border border-gray-300 p-3 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="设置一个公开显示的昵称">
        </div>
        <div>
          <label for="email" class="block text-sm font-medium mb-2">登录邮箱</label>
          <input id="email" type="email" readonly class="w-full rounded-lg border border-gray-200 bg-gray-50 p-3 text-gray-500">
          <p class="mt-1 text-xs text-gray-500">当前版本只展示邮箱，不提供修改邮箱入口。</p>
        </div>
        <button id="save-profile" type="submit" class="w-full rounded-lg bg-primary py-3 font-medium text-white hover:opacity-90 disabled:opacity-50">保存资料</button>
      </form>
      <p id="profile-message" class="mt-5 text-sm" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <script src="./js/profile.js"></script>
</body>
</html>
